# Starter recipes - loaded automatically (no leading underscore).
#
# Ready-to-use custom recipes that showcase what recipe files can do,
# including the `focus` field (telling the encoder WHICH aspect of the
# reference to study). Every value here was render-validated on Krea 2;
# delete this file (or prefix it with "_") if you don't want them in your
# "Use image for" dropdown.
#
# How to read them / make your own: README.md in this folder, or open the
# Recipe Builder (web/recipe-builder.html).

recipes:
  - label: borrow the weather
    description: >-
      Bring a reference's weather over - storm, fog, golden haze - onto your
      own scene. Strong blur + a low detail keep the reference's objects
      (poles, buildings, people) out while the sky and atmosphere arrive.
      Lands clearly from strength ~0.7; try 0.85 for full drama.
    role: lighting
    treatment: strong blur
    color: 1.0
    detail: 0.15
    study: "256"
    framing: stack
    subject: avoid
    early: 1.0
    late: 0.8
    guard: false
    cap: 1.1
    shape: 0.75
    global: 1.3
    focus: the weather, sky condition, and overall atmosphere

  - label: borrow the clothing style
    description: >-
      Study the outfit, not the person: the garment's cut, color, and styling
      travel onto your prompt's subject while the wearer's identity and the
      reference's background stay behind. The focus line does the semantic
      separation - flip it to "the background environment only, not the
      person or their clothing" for the exact inverse. Start near 0.75.
    role: balanced
    treatment: normal
    color: 1.0
    detail: 0.7
    study: "384"
    framing: stack
    subject: avoid
    early: 1.0
    late: 1.0
    guard: false
    cap: 1.1
    shape: 0.8
    global: 1.0
    focus: the clothing and garment style worn by the person, not the person's identity, face, or the background

  - label: borrow drawing medium
    description: >-
      For sketches, ink drawings, studies, and monochrome artwork: a gentle
      monochrome tonal shift toward the reference's paper-and-ink feel,
      keeping the depicted pose, anatomy, and composition out. Deliberately
      quiet - louder settings import the drawing's subject, so pair it with
      a prompt that itself asks for a sketched or drawn look when you want a
      full drawing. Start around 0.5.
    role: style
    treatment: grayscale blur
    color: 0.0
    detail: 0.45
    study: "384"
    framing: stack
    subject: avoid
    early: 0.75
    late: 0.9
    guard: false
    cap: 0.55
    shape: 0.7
    global: 1.35
    layers: [0.04, 0.06, 0.09, 0.13, 0.17, 0.2, 1.2, 2.4, 4.8, 1.44, 3.6, 1.32]
    focus: the line quality, hatching, paper texture, tonal shading, and drawing medium, not the depicted subject, anatomy, pose, text, or composition

  - label: borrow photo finish
    description: >-
      For photographic references: borrow tone, contrast, light, grain, lens
      softness, and color grade while muting people, objects, landmarks, text,
      and scene layout. Lands clearly from about 0.55-0.6 (retuned 2026-07:
      the old values were near-silent); strong sources can tint the setting -
      drop toward 0.5 if the scene starts to drift.
    role: lighting
    treatment: strong blur
    color: 1.0
    detail: 0.2
    study: "256"
    framing: stack
    subject: avoid
    early: 0.85
    late: 0.7
    guard: false
    cap: 0.65
    shape: 0.8
    global: 1.25
    layers: [0.04, 0.05, 0.07, 0.1, 0.16, 0.2, 1.2, 2.64, 5.4, 1.68, 4.8, 1.44]
    focus: the photographic tone, contrast, lighting, lens softness, grain, and color grade, not people, objects, landmarks, text, or scene layout

  - label: cinematic color grade
    description: >-
      A bolder sibling of "suggest the color palette": pulls the reference's
      grade - tint, contrast mood, tonal temperature - over the whole frame
      like a film LUT, subject untouched. Clear from ~0.6; capped at 1.2 so
      it can push harder than the built-in palette recipe when asked.
    role: palette
    treatment: palette wash
    color: 1.0
    detail: 0.0
    study: "256"
    framing: stack
    subject: avoid
    early: 0.9
    late: 0.9
    guard: false
    cap: 1.2
    shape: 0.75
    global: 1.75
    focus: the color grading and tonal mood
