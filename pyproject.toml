[project]
name = "comfyui-krea-reference"
version = "0.2.1"
description = "Guide Krea 2 with reference images: stack up to 12 guide cards using plain-language recipes - keep the subject, borrow style/palette/lighting/material, copy pose or shapes, avoid text/logos - with per-card strength, toward/away direction, timing, and user-defined custom recipes."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Kevin Gilper" }
]
keywords = ["comfyui", "krea", "krea2", "image-reference"]
dependencies = []

[project.urls]
Homepage = "https://github.com/kgilper/krea-reference"
Repository = "https://github.com/kgilper/krea-reference"
Documentation = "https://github.com/kgilper/krea-reference/blob/main/docs/README.md"
Issues = "https://github.com/kgilper/krea-reference/issues"

[tool.comfy]
PublisherId = "kgilper"
DisplayName = "Krea Reference"

[tool.krea-reference]
comfyui_custom_node = true
ships_model_weights = false
